<nav class="navbar navbar-light bg-dark " >
  <span class="quote text-light">WELCOME</span>
</nav>


<div class="container col-md-12 mt-0">
	<div class="d-flex justify-content-center h-100">
		<div class="card">
			<div class="card-header">
				<h3 class="text-center">Sign In</h3>
				
			</div>
			<div class="card-body">
				<form  [formGroup]="loginForm" (ngSubmit)="login()">
					<div class="input-group form-group">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-user"></i></span>
						</div>
						<input type="text" class="form-control" formControlName="email" placeholder="Enter Email" id="login_email" required>
						
					</div>

					<div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors" style="color: red;">
						Invalid account number
					</div>

					<div class="input-group form-group">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-key"></i></span>
						</div>
						<input type="password" class="form-control" formControlName="password" placeholder="password" id="login_password" required>
					</div>

					<div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors" style="color: red;">
						Invalid password
					</div>
					
					<div class="form-group">
						<input type="submit" value="Login" class="btn float-right login_btn " style="width:50%" >
					</div>
				</form>
			</div>
			<p style="color:white;align-items:baseline;">Not a user? <a href="register">Register</a></p>
		</div>
</div>
